services:
  - type: web
    name: achievly
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: achievly-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BOT_TOKEN
        sync: false
      - key: BOT_API_KEY
        sync: false

databases:
  - name: achievly-db
    plan: free
    databaseName: achievly
    user: achievly
